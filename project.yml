# XcodeGen specification for the Wattson Xcode project.
#
#   brew install xcodegen && xcodegen generate
#
# The project is generated rather than committed so that the repository has no
# 40 000-line .pbxproj to merge. Everything that matters about the build is here,
# in a file that can actually be reviewed.

name: Wattson
options:
  bundleIdPrefix: com.navwireless
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  minimumXcodeGenVersion: "2.35.0"
  # Recent XcodeGen defaults to the Xcode 16 project format (77), which Xcode 15
  # refuses to open. 56 is readable by Xcode 15 and later.
  objectVersion: 56

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Apple silicon first, but the binary is universal so an Intel MacBook still
    # gets a working app (with the silicon-specific copy hidden).
    ARCHS: "$(ARCHS_STANDARD)"
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Set this to your Apple Developer team, or configure signing in Xcode.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_HARDENED_RUNTIME: YES
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_HARDENED_RUNTIME: YES

targets:

  WattsonCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/WattsonCore
    settings:
      base:
        PRODUCT_NAME: WattsonCore
        PRODUCT_BUNDLE_IDENTIFIER: com.navwireless.wattson.core
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  Wattson:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - target: WattsonCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Wattson
        PRODUCT_BUNDLE_IDENTIFIER: com.navwireless.wattson
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Wattson.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - WattsonCoreTests
      gatherCoverageData: true
      environmentVariables:
        # Flip to 1 to drive the UI from the simulated power source, which cycles
        # through every state without needing to drain a real battery.
        WATTSON_SIMULATE: "0"

  WattsonCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WattsonCoreTests
    dependencies:
      - target: WattsonCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.navwireless.wattson.core.tests
